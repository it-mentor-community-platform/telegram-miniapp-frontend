name: Design conformance offline tests
on:
  push:
    paths: ['design/**', 'scripts/**', '.cline/skills/design-review/**', '.cline/skills/penpot-design/**', '.github/workflows/design-conformance.yml']
  pull_request:
    paths: ['design/**', 'scripts/**', '.cline/skills/design-review/**', '.cline/skills/penpot-design/**', '.github/workflows/design-conformance.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate-design.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'