<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; border-radius: 50%; background: {{t.primarySoft}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; flex-shrink: 0">СЖ</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
<div style="font-size: 18px; font-weight: 600; line-height: 22px">Привет, Сергей</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="1">
<span style="font-size: 12px; font-weight: 600; line-height: 16px; padding: 2px 8px; border-radius: 6px; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</span>
</sc-for>
</div>
</div>
<button type="button" aria-label="Настройки" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
</button>
</header>

<a href="Repetition.dc.html" style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; text-decoration: none">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 10px; background: {{t.primarySoft}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 16px; font-weight: 600; line-height: 20px">Вопросы к собеседованиям</span>
<span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">Интервальное повторение</span>
</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.chev}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</div>
<dc-import name="StatTiles" items="{{stats}}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
</a>

<a href="Projects.dc.html" style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; text-decoration: none">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 10px; background: {{t.primarySoft}}; color: {{t.primaryText}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14"></path><path d="M15 6v14"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 16px; font-weight: 600; line-height: 20px">Мои проекты</span>
<span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">Прогресс по роадмапу</span>
</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.chev}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<dc-import name="RoadmapProgress" label="Java Backend" steps="{{javaSteps}}" compact="{{ true }}" dark="{{dark}}" hint-size="100%,32px"></dc-import>
<dc-import name="RoadmapProgress" label="Python Backend" steps="{{pythonSteps}}" compact="{{ true }}" dark="{{dark}}" hint-size="100%,32px"></dc-import>
</div>
</a>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; line-height: 18px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.04em">Разделы</h2>
<nav style="display: flex; flex-direction: column; border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; overflow: hidden">
<dc-import name="NavListRow" icon="user" title="Профиль" subtitle="Достижения, проекты и ревью" badge="4 ачивки" href="#" dark="{{dark}}" hint-size="100%,64px"></dc-import>
<dc-import name="NavListRow" icon="review" title="Ревью" subtitle="Ревью на ваши проекты" href="#" divider="{{ true }}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
<dc-import name="NavListRow" icon="mentor" title="Кабинет ментора" subtitle="Цены на ревью и услуги" badge="{{mentorBadge}}" badge-tone="neutral" href="#" divider="{{ true }}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
<dc-import name="NavListRow" icon="people" title="Участники" subtitle="Поиск по имени, GitHub, Telegram" href="#" divider="{{ true }}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
<dc-import name="NavListRow" icon="chart" title="Рынок труда" subtitle="Вакансии и зарплаты на hh.ru" href="#" divider="{{ true }}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
<sc-if value="{{isAdmin}}" hint-placeholder-val="{{ false }}">
<dc-import name="NavListRow" icon="shield" title="Администрирование" subtitle="Роли пользователей" href="#" divider="{{ true }}" dark="{{dark}}" hint-size="100%,64px"></dc-import>
</sc-if>
</nav>
</section>

<sc-if value="{{showDev}}" hint-placeholder-val="{{ true }}">
<section aria-label="Инструменты разработчика" style="display: flex; flex-direction: column; border-radius: 12px; background: {{t.card}}; border: 1px dashed {{t.devBorder}}; overflow: hidden">
<button type="button" onClick="{{toggleDev}}" aria-expanded="{{devExpanded}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border: none; background: transparent; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.text2}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="m8 7-5 5 5 5"></path><path d="m16 7 5 5-5 5"></path><path d="m13.5 4-3 16"></path></svg>
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 20px">Для разработчиков</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 16px; padding: 2px 8px; border-radius: 6px; background: {{statusBg}}; color: {{statusFg}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{statusLabel}}</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.chev}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; transform: {{devRot}}"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{devOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; line-height: 16px; color: {{t.text2}}">Telegram init data</span>
<textarea readonly="{{ true }}" rows="5" value="{{initData}}" style="width: 100%; box-sizing: border-box; resize: none; padding: 10px 12px; border-radius: 8px; border: 1px solid {{t.inputBorder}}; background: {{t.chip}}; color: {{t.text}}; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 17px; word-break: break-all"></textarea>
</label>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<button type="button" onClick="{{copy}}" disabled="{{noData}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: none; border-radius: 8px; background: {{t.btnBg}}; color: {{t.btnText}}; opacity: {{copyOpacity}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
Скопировать
</button>
<sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
<span role="status" style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: {{t.primaryText}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Скопировано</span>
</sc-if>
</div>
<p style="margin: 0; font-size: 12px; line-height: 17px; color: {{t.muted}}">Видно только в тестовых окружениях. Панель ничего не отправляет на сервер. В браузере init data берётся из query-параметров страницы.</p>
</div>
</sc-if>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Студент&quot;,&quot;Студент + ментор&quot;,&quot;Админ&quot;],&quot;default&quot;:&quot;Студент&quot;},&quot;devPanel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Скрыта&quot;,&quot;Свёрнута&quot;,&quot;Раскрыта&quot;],&quot;default&quot;:&quot;Раскрыта&quot;},&quot;inTelegram&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1200}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { devOpen: null, copied: false };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const role = this.props.role ?? 'Студент';
    const t = dark ? {
      bg: '#09090b', card: '#18181b', border: '#27272a', shadow: 'none',
      text: '#fafafa', text2: '#d4d4d8', muted: '#a1a1aa', chev: '#71717a',
      chip: '#27272a', inputBorder: '#3f3f46', devBorder: '#52525b', btnBg: '#34d399', btnText: '#022c22', primarySoft: 'rgba(52, 211, 153, 0.16)', primaryText: '#6ee7b7',
      track: '#3f3f46', bar: '#34d399',
      warnSoft: 'rgba(249, 115, 22, 0.16)', warnText: '#fdba74',
      infoSoft: 'rgba(96, 165, 250, 0.16)', infoText: '#93c5fd',
      violetSoft: 'rgba(167, 139, 250, 0.16)', violetText: '#c4b5fd'
    } : {
      bg: '#f8fafc', card: '#ffffff', border: '#e2e8f0', shadow: '0 1px 2px rgba(15, 23, 42, 0.04)',
      text: '#0f172a', text2: '#334155', muted: '#64748b', chev: '#94a3b8',
      chip: '#f1f5f9', inputBorder: '#cbd5e1', devBorder: '#94a3b8', btnBg: '#047857', btnText: '#ffffff', primarySoft: '#ecfdf5', primaryText: '#047857',
      track: '#e2e8f0', bar: '#10b981',
      warnSoft: '#fff7ed', warnText: '#c2410c',
      infoSoft: '#eff6ff', infoText: '#1d4ed8',
      violetSoft: '#f5f3ff', violetText: '#6d28d9'
    };
    const isMentor = role !== 'Студент';
    const isAdmin = role === 'Админ';
    const roles = [{ label: 'Студент', bg: t.primarySoft, fg: t.primaryText }];
    if (isMentor) roles.push({ label: 'Ментор', bg: t.infoSoft, fg: t.infoText });
    if (isAdmin) roles.push({ label: 'Админ', bg: t.violetSoft, fg: t.violetText });
    const devPanel = this.props.devPanel ?? 'Раскрыта';
    const inTelegram = this.props.inTelegram ?? true;
    const devOpen = this.state.devOpen ?? (devPanel === 'Раскрыта');
    return { t, dark,
      showDev: devPanel !== 'Скрыта', devOpen, devExpanded: devOpen ? 'true' : 'false', devRot: devOpen ? 'rotate(180deg)' : 'none',
      statusLabel: inTelegram ? 'Telegram' : 'Браузер',
      statusBg: inTelegram ? t.primarySoft : t.warnSoft, statusFg: inTelegram ? t.primaryText : t.warnText,
      initData: inTelegram ? 'query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A123456789%2C%22first_name%22%3A%22%D0%A1%D0%B5%D1%80%D0%B3%D0%B5%D0%B9%22%2C%22username%22%3A%22zhukovsd%22%2C%22language_code%22%3A%22ru%22%7D&auth_date=1792860000&hash=c501b71e775f74ce10e377dea85a7ea24ecd640b223ea86dfe453e0eaed2e2b2' : 'Init data не найдена. Откройте приложение из Telegram или добавьте query-параметры к URL.',
      copied: this.state.copied, noData: !inTelegram, copyOpacity: inTelegram ? 1 : 0.5,
      toggleDev: () => this.setState({ devOpen: !devOpen, copied: false }),
      copy: () => this.setState({ copied: true }), javaSteps: [true, false, true, true, false, false], pythonSteps: [true, false, false, false, false, false], mentorBadge: isMentor ? '' : 'Неактивен', stats: [{ value: 12, label: 'к повторению', tone: 'warn' }, { value: 5, label: 'тем', tone: 'neutral' }, { value: 108, label: 'выучено', tone: 'neutral' }], roles, isAdmin, inactiveMentor: !isMentor };
  }
}
</script>
</body>
</html>
