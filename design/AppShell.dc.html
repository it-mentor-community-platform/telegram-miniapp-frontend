<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AppShell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.hv-nav{transition:background-color .15s,color .15s}
@media (hover:hover){.hv-l.hv-nav:not([aria-current="page"]):hover{background:#f1f5f9!important;color:#0f172a!important}.hv-d.hv-nav:not([aria-current="page"]):hover{background:#27272a!important;color:#fafafa!important}}
</style>
</helmet>
<aside aria-label="Разделы приложения" style="width: {{w}}px; height: {{h}}px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: {{pad}}; background: {{t.card}}; border-right: 1px solid {{t.border}}; font-family: Inter, system-ui, sans-serif; color: {{t.text}}; -webkit-font-smoothing: antialiased">

<a href="{{homeHref}}" aria-label="IT Ментор — на главную" style="display: flex; align-items: center; justify-content: {{logoJustify}}; gap: 10px; height: 40px; text-decoration: none; color: {{t.text}}">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{t.btnBg}}; color: {{t.btnText}}; font-size: 14px; font-weight: 700; letter-spacing: -0.02em">IT</span>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 16px; font-weight: 700; line-height: 20px">IT Ментор</span>
</sc-if>
</a>

<nav style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" aria-current="{{it.current}}" class="hv-nav hv-{{tk}}" style="display: flex; flex-direction: {{dir}}; align-items: center; justify-content: {{itemJustify}}; gap: {{itemGap}}; min-height: {{itemH}}; padding: {{itemPad}}; box-sizing: border-box; border-radius: 8px; background: {{it.bg}}; color: {{it.fg}}; text-decoration: none; font-size: {{fs}}; font-weight: 600; line-height: {{lh}}; text-align: {{ta}}">
<sc-if value="{{it.is.home}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg></sc-if>
<sc-if value="{{it.is.repetition}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg></sc-if>
<sc-if value="{{it.is.projects}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14"></path><path d="M15 6v14"></path></svg></sc-if>
<span>{{it.label}}</span>
</a>
</sc-for>
</nav>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: {{logoJustify}}; gap: 10px; padding-top: 16px; border-top: 1px solid {{t.border}}">
<span aria-label="{{userAria}}" role="img" style="width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{t.primarySoft}}; color: {{t.primaryText}}; font-size: 13px; font-weight: 600">СЖ</span>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Сергей Жуков</span>
<span style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="1">
<span style="font-size: 11px; font-weight: 600; line-height: 14px; padding: 1px 6px; border-radius: 5px; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</span>
</sc-for>
</span>
</span>
</sc-if>
</div>

</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["desktop","tablet"],"default":"desktop"},"active":{"editor":"enum","options":["home","repetition","projects","none"],"default":"home"},"role":{"editor":"enum","options":["Студент","Студент + ментор","Админ"],"default":"Студент"},"height":{"editor":null,"tsType":"number"},"dark":{"editor":"boolean","default":false},"$preview":{"width":248,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const full = (this.props.layout ?? 'desktop') !== 'tablet';
    const active = this.props.active ?? 'home';
    const role = this.props.role ?? 'Студент';
    const t = dark ? {
      card: '#18181b', border: '#27272a', text: '#fafafa', text2: '#d4d4d8', muted: '#a1a1aa',
      primarySoft: 'rgba(52, 211, 153, 0.16)', primaryText: '#6ee7b7', btnBg: '#34d399', btnText: '#022c22',
      infoSoft: 'rgba(96, 165, 250, 0.16)', infoText: '#93c5fd', violetSoft: 'rgba(167, 139, 250, 0.16)', violetText: '#c4b5fd'
    } : {
      card: '#ffffff', border: '#e2e8f0', text: '#0f172a', text2: '#334155', muted: '#64748b',
      primarySoft: '#ecfdf5', primaryText: '#047857', btnBg: '#047857', btnText: '#ffffff',
      infoSoft: '#eff6ff', infoText: '#1d4ed8', violetSoft: '#f5f3ff', violetText: '#6d28d9'
    };
    const suffix = full ? '-Desktop.dc.html' : '-Tablet.dc.html';
    const items = [
      { key: 'home', label: 'Главная', short: 'Главная', file: 'Main' },
      { key: 'repetition', label: 'Вопросы к собеседованиям', short: 'Вопросы', file: 'Repetition' },
      { key: 'projects', label: 'Мои проекты', short: 'Проекты', file: 'Projects' }
    ].map((x) => {
      const on = x.key === active;
      const is = { home: x.key === 'home', repetition: x.key === 'repetition', projects: x.key === 'projects' };
      return {
        is, label: full ? x.label : x.short, href: x.file + suffix,
        current: on ? 'page' : 'false',
        bg: on ? t.primarySoft : 'transparent',
        fg: on ? t.primaryText : t.text2
      };
    });
    const roles = [{ label: 'Студент', bg: t.primarySoft, fg: t.primaryText }];
    if (role !== 'Студент') roles.push({ label: 'Ментор', bg: t.infoSoft, fg: t.infoText });
    if (role === 'Админ') roles.push({ label: 'Админ', bg: t.violetSoft, fg: t.violetText });
    return {
      t, full, items, roles, tk: dark ? 'd' : 'l',
      w: full ? 248 : 88, h: this.props.height ?? 800,
      pad: full ? '20px 16px' : '20px 8px',
      homeHref: 'Main' + suffix,
      logoJustify: full ? 'flex-start' : 'center',
      dir: full ? 'row' : 'column',
      itemJustify: full ? 'flex-start' : 'center',
      itemGap: full ? '12px' : '4px',
      itemH: full ? '44px' : '60px',
      itemPad: full ? '0 12px' : '8px 4px',
      fs: full ? '14px' : '11px',
      lh: full ? '18px' : '14px',
      ta: full ? 'left' : 'center',
      userAria: 'Сергей Жуков · ' + roles.map((r) => r.label).join(', ')
    };
  }
}
</script>
</body>
</html>
