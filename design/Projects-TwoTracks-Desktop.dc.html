<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мои проекты — Java и Python, десктоп</title>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px">
<dc-import name="Projects" scenario="Java и Python" layout="desktop" dark="{{dark}}" hint-size="1280px,800px"></dc-import>

  renderVals() {
    return { dark: this.props.dark ?? false };
  }
}
</script>
