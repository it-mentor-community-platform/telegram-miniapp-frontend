<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Страница проекта — новая реализация сдана</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}; height: {{h}}">
<dc-import name="ProjectType" scenario="Новая реализация сдана" dark="{{dark}}" layout="{{layout}}" hint-size="390px,1240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"layout":{"editor":"enum","options":["mobile","tablet","desktop"],"default":"mobile"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const layout = this.props.layout ?? 'mobile';
    const wide = layout !== 'mobile';
    return { dark: this.props.dark ?? false, layout, w: wide ? 'auto' : '390px', h: wide ? 'auto' : '1240px' };
  }
}
</script>
</body>
</html>
