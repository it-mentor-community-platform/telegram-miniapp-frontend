<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Все темы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
input::placeholder{color:#94a3b8}
@keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<div style="width: {{L.frameW}}px; height: {{L.frameH}}px; display: flex; background: {{t.bg}}">
<sc-if value="{{L.shell}}" hint-placeholder-val="{{ false }}">
<dc-import name="AppShell" layout="{{layout}}" active="repetition" role="{{L.role}}" height="{{L.frameH}}" dark="{{dark}}" hint-size="248px,100%"></dc-import>
</sc-if>
<div style="flex: 1; min-width: 0; box-sizing: border-box; padding: {{L.areaPad}}; display: flex; justify-content: center; align-items: {{L.areaAlign}}">
<div style="position: relative; width: {{L.colW}}; max-width: {{L.maxW}}; height: {{L.rootH}}; box-sizing: border-box; padding: {{L.rootPad}}; display: {{L.display}}; flex-direction: column; grid-template-columns: {{L.cols}}; align-content: start; align-items: {{L.items}}; column-gap: {{L.colGap}}; gap: 16px; background: {{L.rootBg}}; border: {{L.rootBorder}}; border-radius: {{L.rootRadius}}; box-shadow: {{L.rootShadow}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="display: flex; flex-direction: column; gap: 4px">
<div style="margin: -12px 0 -4px 0">
<dc-import name="Breadcrumbs" items="{{crumbs}}" home-href="{{L.home}}" dark="{{dark}}" hint-size="100%,44px"></dc-import>
</div>
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 28px">Все темы</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: {{t.muted}}">Добавьте темы, вопросы из которых хотите повторять</p>
</header>

<div style="display: {{L.toolbar}}; align-items: center; gap: 12px">
<label style="flex: {{L.searchFlex}}; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{t.inputBorder}}; background: {{t.card}}; color: {{t.muted}}">
<span class="sr-only">Поиск по темам</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" placeholder="Поиск по темам" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: {{t.text}}">
</label>

<div role="group" aria-label="Специализация" style="width: {{L.filterW}}; flex-shrink: {{L.filterShrink}}; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 10px; background: {{t.chip}}">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 36px; border: none; border-radius: 7px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}; box-shadow: {{f.sh}}">{{f.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; line-height: 18px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.04em"><span>{{g.title}}</span><span style="text-transform: none; letter-spacing: 0; font-weight: 500">{{g.meta}}</span></h2>
<div style="display: {{L.listDisplay}}; flex-direction: column; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; overflow: hidden">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 64px; box-sizing: border-box; border-top: 1px solid {{it.sep}}; box-shadow: inset 1px 0 0 {{it.sepL}}">
<a href="{{topicHref}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none">
<span style="font-size: 15px; font-weight: 600; line-height: 20px">{{it.name}}</span>
<span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">{{it.meta}}</span>
</a>
<button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.pressed}}" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; background: {{it.bg}}; color: {{it.fg}}; border: 1px solid {{it.bd}}">
<sc-if value="{{it.selected}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
<span>На повторении</span>
</sc-if>
<sc-if value="{{it.notSelected}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Добавить</span>
</sc-if>
</button>
</div>
</sc-for>
</div>
</section>
</sc-for>
</sc-if>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{skelGroups}}" as="g" hint-placeholder-count="2">
<section aria-busy="true" aria-label="Загрузка тем" style="display: flex; flex-direction: column; gap: 8px">
<span aria-hidden="true" style="display: flex; justify-content: space-between; padding: 2px 4px"><span style="display: block; width: {{g.w}}; height: 14px; border-radius: 4px; background: {{t.skel}}; animation: sk-pulse 1.4s ease-in-out infinite"></span><span style="display: block; width: 90px; height: 14px; border-radius: 4px; background: {{t.skel}}; animation: sk-pulse 1.4s ease-in-out infinite"></span></span>
<div aria-hidden="true" style="display: {{L.listDisplay}}; flex-direction: column; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; overflow: hidden">
<sc-for list="{{g.items}}" as="k" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 64px; box-sizing: border-box; border-top: 1px solid {{k.sep}}; box-shadow: inset 1px 0 0 {{k.sepL}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span style="display: block; width: {{k.w}}; height: 15px; border-radius: 4px; background: {{t.skel}}; animation: sk-pulse 1.4s ease-in-out infinite"></span><span style="display: block; width: {{k.w2}}; height: 12px; border-radius: 4px; background: {{t.skel}}; animation: sk-pulse 1.4s ease-in-out infinite"></span></span>
<span style="display: block; width: 104px; height: 36px; border-radius: 8px; background: {{t.skel}}; animation: sk-pulse 1.4s ease-in-out infinite; flex-shrink: 0"></span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</sc-if>

<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
<section role="alert" style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 12px; background: {{t.errSoft}}; border: 1px solid {{t.errBorder}}">
<div style="display: flex; gap: 10px; align-items: flex-start; color: {{t.errText}}; font-size: 14px; line-height: 20px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
<span>Не удалось загрузить список тем. Проверьте соединение и попробуйте ещё раз.</span>
</div>
<button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{t.errBorder}}; background: {{t.card}}; color: {{t.errText}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
Попробовать снова
</button>
</section>
</sc-if>

<sc-if value="{{onboarding}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: {{t.bg}}; border-top: 1px solid {{t.border}}">
<a href="{{topicBack}}" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: {{t.btnBg}}; color: {{t.btnText}}; font-size: 16px; font-weight: 600; text-decoration: none">Продолжить · выбрано {{selectedCount}}</a>
</div>
</sc-if>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"layout":{"editor":"enum","options":["mobile","tablet","desktop"],"default":"mobile"},"scenario":{"editor":"enum","options":["Данные","Загрузка","Ошибка"],"default":"Данные"},"onboarding":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', sel: { j2: true, j1: true, j3: true, j4: true, j7: true } };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const scenario = this.props.scenario ?? 'Данные'; const ok = scenario === 'Данные', isLoading = scenario === 'Загрузка', isError = scenario === 'Ошибка';
    const onboarding = this.props.onboarding ?? false;
    const t = dark ? {
      bg: '#09090b', skel: '#27272a', errSoft: 'rgba(248, 113, 113, 0.14)', errText: '#fca5a5', errBorder: 'rgba(248, 113, 113, 0.35)', card: '#18181b', border: '#27272a', inputBorder: '#3f3f46', shadow: 'none',
      text: '#fafafa', text2: '#d4d4d8', muted: '#a1a1aa', chev: '#71717a',
      chip: '#27272a', seg: '#3f3f46', primarySoft: 'rgba(52, 211, 153, 0.16)', primaryText: '#6ee7b7',
      btnBg: '#34d399', btnText: '#022c22'
    } : {
      bg: '#f8fafc', skel: '#e2e8f0', errSoft: '#fef2f2', errText: '#b91c1c', errBorder: '#fecaca', card: '#ffffff', border: '#e2e8f0', inputBorder: '#cbd5e1', shadow: '0 1px 2px rgba(15, 23, 42, 0.04)',
      text: '#0f172a', text2: '#334155', muted: '#64748b', chev: '#94a3b8',
      chip: '#f1f5f9', seg: '#ffffff', primarySoft: '#ecfdf5', primaryText: '#047857',
      btnBg: '#047857', btnText: '#ffffff'
    };
    const layout = this.props.layout ?? 'mobile';
    const wide = layout !== 'mobile';
    const desk = layout === 'desktop';
    const DESK = ['Main', 'Repetition', 'Categories', 'Topic', 'Stats', 'Review', 'Review-Done', 'Projects', 'Projects-Multi', 'Projects-Loading', 'ProjectType', 'ProjectType-List', 'ProjectType-Submitted', 'ProjectType-Loading', 'ProjectType-NotFound', 'Implementation', 'Impl-Hangman', 'AuthError', 'DevLogin'];
    const dk = (h) => (wide && typeof h === 'string' && DESK.includes(h.replace('.dc.html', ''))) ? h.replace('.dc.html', '-Desktop.dc.html') : h;
    const L = {
      wide, desk, mobileOnly: !wide, shell: wide && true, role: 'Студент',
      frameW: desk ? 1280 : wide ? 834 : 390,
      frameH: wide ? (desk ? 840 : 1112) : (ok ? 1240 : 844),
      areaPad: !wide ? '0' : desk ? '32px 40px 48px' : '24px 24px 40px', areaAlign: 'flex-start',
      colW: wide ? '100%' : '390px', maxW: wide ? '1024px' : 'none',
      rootH: wide ? 'auto' : (ok ? '1240px' : '844px'), rootPad: wide ? '0' : '20px 16px 104px',
      display: 'flex', cols: 'none', items: 'stretch', colGap: '24px',
      rootBg: t.bg, rootBorder: 'none', rootRadius: '0', rootShadow: 'none', rootGap: '0',
      full: '1 / -1', grp: wide ? 'flex' : 'contents', blk: wide ? 'block' : 'contents',
      home: wide ? 'Main-Desktop.dc.html' : 'Main.dc.html'
    };
    Object.assign(L, { toolbar: wide ? 'flex' : 'contents', searchFlex: wide ? '1 1 auto' : '0 1 auto', filterW: wide ? '360px' : 'auto', filterShrink: wide ? '0' : '1',
      listDisplay: wide ? 'grid' : 'flex', rootPad: wide ? (onboarding ? '0 0 96px' : '0') : '20px 16px 104px' });
    const { filter, sel } = this.state;
    const data = [
      { key: 'java', title: 'Java Backend', items: [
        { id: 'j1', name: 'Core', count: 38, pct: 68 },
        { id: 'j2', name: 'Коллекции', count: 42, pct: 52 },
        { id: 'j3', name: 'ООП', count: 31, pct: 71 },
        { id: 'j4', name: 'Многопоточность', count: 36, pct: 47 },
        { id: 'j5', name: 'JVM', count: 27, pct: 0 },
        { id: 'j6', name: 'Spring', count: 29, pct: 0 },
        { id: 'j7', name: 'Брокеры сообщений', count: 24, pct: 88 },
        { id: 'j8', name: 'Базы данных и SQL', count: 33, pct: 0 }
      ] },
      { key: 'python', title: 'Python Backend', items: [
        { id: 'p1', name: 'Основы языка', count: 30, pct: 0 },
        { id: 'p2', name: 'Коллекции', count: 25, pct: 0 },
        { id: 'p3', name: 'ООП', count: 22, pct: 0 },
        { id: 'p4', name: 'Асинхронность', count: 18, pct: 0 }
      ] },
      { key: 'go', title: 'Go Backend', items: [
        { id: 'g1', name: 'Основы языка', count: 26, pct: 0 },
        { id: 'g2', name: 'Горутины и каналы', count: 20, pct: 0 }
      ] }
    ];
    const plural = (n) => {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return 'вопрос';
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'вопроса';
      return 'вопросов';
    };
    const groups = data.filter((g) => filter === 'all' || filter === g.key).map((g) => {
      const items = g.items.map((it, i) => {
        const selected = !!sel[it.id];
        return {
          ...it,
          selected,
          notSelected: !selected,
          pressed: selected ? 'true' : 'false',
          meta: it.count + ' ' + plural(it.count) + (it.pct > 0 ? ' · выучено ' + it.pct + '%' : ''),
          sep: (wide ? i < 2 : i === 0) ? 'transparent' : t.border,
          sepL: wide && i % 2 === 1 ? t.border : 'transparent',
          bg: selected ? t.primarySoft : t.card,
          fg: selected ? t.primaryText : t.text2,
          bd: selected ? 'transparent' : t.inputBorder,
          toggle: () => this.setState({ sel: { ...this.state.sel, [it.id]: !this.state.sel[it.id] } })
        };
      });
      const n = items.filter((x) => x.selected).length;
      return { title: g.title, items, meta: n > 0 ? 'на повторении ' + n + ' из ' + items.length : items.length + ' тем' };
    });
    const filters = [['all', 'Все'], ['java', 'Java'], ['python', 'Python'], ['go', 'Go']].map(([key, label]) => ({
      label,
      pressed: filter === key ? 'true' : 'false',
      bg: filter === key ? t.seg : 'transparent',
      fg: filter === key ? t.text : t.muted,
      sh: filter === key ? '0 1px 2px rgba(15, 23, 42, 0.08)' : 'none',
      pick: () => this.setState({ filter: key })
    }));
    const selectedCount = Object.values(sel).filter(Boolean).length;
    return { layout, L, dk, tk: dark ? 'd' : 'l', topicHref: dk('Topic.dc.html'), topicBack: dk('Repetition.dc.html'), t, dark, crumbs: [{ label: 'Повторение', href: dk('Repetition.dc.html') }], groups, filters, onboarding, selectedCount, ok, isLoading, isError,
      skelGroups: [['130px', 5], ['150px', 3]].map(([w, n]) => ({ w, items: Array.from({ length: n }, (_, i) => ({ w: ['40%', '55%', '35%', '60%'][i % 4], w2: ['30%', '45%', '38%', '28%'][i % 4], sep: (wide ? i < 2 : i === 0) ? 'transparent' : t.border, sepL: wide && i % 2 === 1 ? t.border : 'transparent' })) })) };
  }
}
</script>
</body>
</html>
