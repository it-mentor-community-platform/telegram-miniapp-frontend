<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Повторение — планшет</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 834px; height: 1112px">
<dc-import name="Repetition" layout="tablet" dark="{{dark}}" hint-size="834px,1112px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? false };
  }
}
</script>
</body>
</html>
