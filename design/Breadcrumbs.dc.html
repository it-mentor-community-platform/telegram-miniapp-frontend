<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Breadcrumbs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Навигация" style="margin-left: -12px; font-family: Inter, system-ui, sans-serif; color: {{t.muted}}">
<ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; min-width: 0">
<li style="display: flex; flex-shrink: 0"><a href="Main.dc.html" aria-label="Главная" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: {{t.muted}}; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg></a></li>
<sc-for list="{{crumbs}}" as="c" hint-placeholder-count="1">
<li aria-hidden="true" style="display: flex; flex-shrink: 0; color: {{t.chev}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></li>
<li style="display: flex; min-width: 0; flex-shrink: {{c.shrink}}"><a href="{{c.href}}" style="display: block; height: 44px; line-height: 44px; padding: 0 8px; font-size: 13px; font-weight: 500; color: {{t.muted}}; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.label}}</a></li>
</sc-for>
</ol>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null,"tsType":"{ label: string; href: string }[]"},"dark":{"editor":"boolean","default":false},"$preview":{"width":358,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? { muted: '#a1a1aa', chev: '#71717a' } : { muted: '#64748b', chev: '#94a3b8' };
    const items = this.props.items ?? [{ label: 'Мои проекты', href: 'Projects.dc.html' }, { label: 'Обмен валют', href: 'ProjectType-List.dc.html' }];
    const crumbs = items.map((c, i) => ({ ...c, shrink: i === items.length - 1 ? 1 : 0 }));
    return { t, crumbs };
  }
}
</script>
</body>
</html>
