<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — откройте в Telegram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center">
<span style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{iconBg}}; color: {{iconFg}}">
<sc-if value="{{outside}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 2.5 11l7 2.5 2.5 7z"></path><path d="m21.5 3.5-12 10"></path></svg>
</sc-if>
<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16h.01"></path></svg>
</sc-if>
</span>

<div style="display: flex; flex-direction: column; gap: 8px; max-width: 320px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 28px">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: {{t.muted}}">{{text}}</p>
</div>

<sc-if value="{{outside}}" hint-placeholder-val="{{ true }}">
<ol style="margin: 0; padding: 16px; list-style: none; display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box; border-radius: 12px; background: {{t.card}}; border: 1px solid {{t.border}}; text-align: left">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 20px; color: {{t.text2}}">
<span style="width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{t.chip}}; color: {{t.text}}">{{s.n}}</span>
<span style="padding-top: 2px">{{s.text}}</span>
</li>
</sc-for>
</ol>
</sc-if>
</main>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{outside}}" hint-placeholder-val="{{ true }}">
<a href="https://t.me/" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 10px; background: {{t.btnBg}}; color: {{t.btnText}}; font-size: 16px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
Открыть в Telegram
</a>
<a href="https://telegram.org/apps" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; color: {{t.primaryText}}; font-size: 15px; font-weight: 600; text-decoration: none">Нет Telegram? Установить</a>
</sc-if>
<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: none; border-radius: 10px; background: {{t.btnBg}}; color: {{t.btnText}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
Попробовать снова
</button>
<a href="https://t.me/zhukovsd_it_chat" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; color: {{t.primaryText}}; font-size: 15px; font-weight: 600; text-decoration: none">Написать в чат сообщества</a>
</sc-if>

<sc-if value="{{showDev}}" hint-placeholder-val="{{ false }}">
<p style="margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; border: 1px dashed {{t.devBorder}}; font-size: 12px; line-height: 17px; color: {{t.muted}}; text-align: left"><span style="font-weight: 600; color: {{t.text2}}">Для разработчиков:</span> в тестовом окружении добавьте init data в query-параметры URL или войдите через dummy auth.</p>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"scenario":{"editor":"enum","options":["Вне Telegram","Ошибка входа"],"default":"Вне Telegram"},"devHint":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const failed = (this.props.scenario ?? 'Вне Telegram') === 'Ошибка входа';
    const t = dark ? {
      bg: '#09090b', card: '#18181b', border: '#27272a', text: '#fafafa', text2: '#d4d4d8', muted: '#a1a1aa',
      chip: '#27272a', devBorder: '#52525b', primarySoft: 'rgba(52, 211, 153, 0.16)', primaryText: '#6ee7b7',
      warnSoft: 'rgba(249, 115, 22, 0.16)', warnText: '#fdba74', btnBg: '#34d399', btnText: '#022c22'
    } : {
      bg: '#f8fafc', card: '#ffffff', border: '#e2e8f0', text: '#0f172a', text2: '#334155', muted: '#64748b',
      chip: '#f1f5f9', devBorder: '#94a3b8', primarySoft: '#ecfdf5', primaryText: '#047857',
      warnSoft: '#fff7ed', warnText: '#c2410c', btnBg: '#047857', btnText: '#ffffff'
    };
    return {
      t, failed, outside: !failed,
      showDev: this.props.devHint ?? false,
      iconBg: failed ? t.warnSoft : t.primarySoft,
      iconFg: failed ? t.warnText : t.primaryText,
      title: failed ? 'Не удалось войти' : 'Откройте приложение в Telegram',
      text: failed
        ? 'Telegram не подтвердил вход или сервер сейчас недоступен. Попробуйте ещё раз — если ошибка повторится, напишите нам.'
        : 'IT Ментор — мини-приложение Telegram. Вход происходит автоматически через ваш аккаунт, поэтому в обычном браузере приложение не работает.',
      steps: [
        { n: 1, text: 'Нажмите «Открыть в Telegram» — приложение откроется на той же странице.' },
        { n: 2, text: 'Или найдите бота сообщества в Telegram и нажмите кнопку приложения.' },
        { n: 3, text: 'Вход произойдёт сам — логин и пароль не нужны.' }
      ]
    };
  }
}
</script>
</body>
</html>
